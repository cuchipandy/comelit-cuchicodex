set_microphone_gain:
  name: Set microphone gain
  description: Adjust phone-to-entrance microphone amplification without restarting the call.
  target:
    entity:
      integration: comelit_man
      domain: camera
  fields:
    gain:
      name: Amplification
      required: true
      selector:
        select:
          options:
            - value: "1"
              label: "Original (0 dB)"
            - value: "1.2589254117941673"
              label: "+2 dB"
            - value: "1.5848931924611136"
              label: "+4 dB"
            - value: "2"
              label: "+6 dB"
            - value: "2.51188643150958"
              label: "+8 dB"
